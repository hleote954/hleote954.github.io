<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<h2>Last 48 hourly readings</h2>
<script>
let gradient;
function getGradient(ctx, chartArea, minValue, maxValue) {
  const VERY_HOT  = 45;
  const VERY_COLD = 10;
  if (!gradient) {
    // Create the gradient because this is the first render
    f = -22;
    calc_top    = chartArea.top    + (f * (VERY_HOT  - maxValue));
    calc_bottom = chartArea.bottom + (f * (minValue - VERY_COLD));
    gradient = ctx.createLinearGradient(0, calc_bottom, 0, calc_top);
    gradient.addColorStop(0, 'rgb(54, 162, 235)');
    gradient.addColorStop(0.5, 'rgb(255, 205, 86)');
    gradient.addColorStop(1, 'rgb(255, 99, 132)');
  }
  return gradient;
}
function pad(num, size) {
    num = num.toString();
    while (num.length < size) num = "0" + num;
    return num;
}
const windBarbsImgs = [];
var i = 0;
for (i = 0; i < 21; i++)
{
  windBarbsImgs[i] = new Image(25,25);
  windBarbsImgs[i].src = "images/Symbol_wind_speed_" + pad(i + 1, 2) + ".png";
}
</script>

new Chart("hourlyWindChart",
{
  type: "line",
  data: {
    labels: xLabels,
    datasets: [
    {
      data: [9.0,5.1,4.2,5.1,2.7,3.3,5.9,4.4,6.8,8.5,4.3,3.2,7.9,6.3,3.8,0.6,1.0,4.0,1.3,0.7,2.2,5.0,11.5,9.6,7.7,5.8,7.1,6.3,5.2,5.0,2.8,2.8,2.0,1.2,2.2,1.3,1.6,2.3,1.2,0.2,2.0,1.7,2.0,3.2,3.7,5.3,8.9,9.4],
      borderColor: "green",
      label: "Average",
      yAxisID: 'y1',
      tension: 0.4,
      fill: false
    },
    {
      data: [16.6,15.8,15.8,15.8,13.7,13.7,12.2,11.5,11.5,15.8,12.2,9.4,12.2,11.2,10.8,5.0,8.6,10.4,6.8,4.3,8.6,9.7,19.1,19.8,17.3,13.7,13.7,12.2,12.6,15.8,7.9,7.9,7.9,4.7,6.8,5.4,5.8,8.6,5.4,4.0,7.6,5.8,9.4,9.7,9.7,12.2,18.0,16.6],
      borderColor: "magenta",
      label: "Gusts",
      yAxisID: 'y1',
      tension: 0.4,
      pointStyle: function(context, options) {
        try {
          const index = context.dataIndex;
          const value = context.dataset.data[index];
          const knots = value * 0.539956803;
          if (knots >= 105)
            return windBarbsImgs[20];
          else if (knots <= 5)
            return windBarbsImgs[0];
          return windBarbsImgs[Math.round(knots/5)];
        } catch (e) {
          console.log(e);
          return false;
        }
      },
      rotation: function(context, options) {
        try {
          const xPointRotation = [68,68,248,68,68,180,202,248,248,248,248,292,248,248,248,45,22,0,22,22,22,68,135,135,135,202,135,202,180,270,248,248,292,337,315,315,292,68,45,337,45,68,68,68,68,202,180,202];
          const index = context.dataIndex;
          return xPointRotation[index] + 90;
        } catch (e) {
          console.log(e);
          return 0;
        }
      },
      radius: 10,
      fill: false
    }
    ]
  },
  options: {
    legend: {display: true},
    title: {display: true, text: "Wind speed (km/h)", fontSize: 16},
    plugins: {
        title: {
          display: true,
          text: 'Wind speed (km/h)'
        },
        tooltip: {
          callbacks: {
            afterLabel: function (context) {

                const index = context.dataIndex;
                const xDirection = ["ENE","ENE","WSW","ENE","ENE","S","SSW","WSW","WSW","WSW","WSW","WNW","WSW","WSW","WSW","NE","NNE","N","NNE","NNE","NNE","ENE","SE","SE","SE","SSW","SE","SSW","S","W","WSW","WSW","WNW","NNW","NW","NW","WNW","ENE","NE","NNW","NE","ENE","ENE","ENE","ENE","SSW","S","SSW"];
                return 'Direction: ' + xDirection[index];
              } catch (e) {
                console.log(e);
                return "";
              }

          }
        }
    },
    scales: {
          y1: {
            type: 'linear',
            display: 'auto',
            position: 'left',
          },
    }
  }
});
